spring.application.name=notification-service

server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/notification_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:notification-service-consumer}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

tandem.kafka.topic.user-registered=${KAFKA_TOPIC_USER_REGISTERED:user.registered}
tandem.kafka.topic.profile-onboarding-completed=${KAFKA_TOPIC_PROFILE_ONBOARDING_COMPLETED:profile.onboarding.completed}
tandem.kafka.topic.message-sent=${KAFKA_TOPIC_MESSAGE_SENT:message.sent}
tandem.kafka.topic.chat-created=${KAFKA_TOPIC_CHAT_CREATED:chat.created}
tandem.kafka.topic.group-created=${KAFKA_TOPIC_GROUP_CREATED:group.created}
tandem.kafka.topic.member-joined=${KAFKA_TOPIC_MEMBER_JOINED:member.joined}
tandem.kafka.topic.member-banned=${KAFKA_TOPIC_MEMBER_BANNED:member.banned}
tandem.kafka.topic.group-message-sent=${KAFKA_TOPIC_GROUP_MESSAGE_SENT:group.message.sent}

logging.level.root=INFO
logging.level.com.tandem=DEBUG

notification.delivery.initial-delay-ms=1000
notification.delivery.poll-interval-ms=500
notification.delivery.batch-size=100
notification.delivery.max-retries=5
notification.delivery.base-backoff-ms=250
