services:

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      retries: 10

  maven:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: auth_maven_build
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "
        apt-get update && \
        apt-get install -y postgresql-client netcat-openbsd && \
        echo 'Waiting for Postgres to be ready...'; \
        until pg_isready -h postgres -U auth_user -d auth_db; do \
          sleep 2; \
        done; \
        echo 'Postgres is ready, running migrations...'; \
        mvn flyway:migrate -Dflyway.url=jdbc:postgresql://postgres:5432/auth_db -Dflyway.user=auth_user -Dflyway.password=auth_pass
        echo 'Running jOOQ code generation...'; \
        mvn jooq-codegen:generate && \
        echo 'Building project package...'; \
        mvn clean package -DskipTests
      "

