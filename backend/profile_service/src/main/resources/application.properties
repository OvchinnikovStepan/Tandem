# ============ Application ============
spring.application.name=profile-service

# ============ Server ============
server.port=8082

# ============ Database ============
spring.datasource.url=jdbc:postgresql://localhost:5432/ProfileService
spring.datasource.username=postgres
spring.datasource.password=koroleva
spring.datasource.driver-class-name=org.postgresql.Driver

# ============ JOOQ ============
spring.jooq.sql-dialect=POSTGRES

# ============ Flyway ============
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ============ Swagger ============
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============ Kafka ============
spring.kafka.bootstrap-servers=localhost:9093

# --- Producer Configuration ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.enable-idempotence=true

# --- Consumer Configuration ---
spring.kafka.consumer.group-id=${spring.application.name}-local
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.tandem.*
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# --- Kafka Listener Configuration ---
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.concurrency=3
