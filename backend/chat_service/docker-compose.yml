version: '3.8'

services:
  db:
    image: postgres:15
    container_name: chat-service-db
    restart: always
    environment:
      POSTGRES_DB: ChatService
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d InterestService"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tandem-network

  app:
    build: .
    container_name: chat-service-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ChatService
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JOOQ_SQL_DIALECT: POSTGRES
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_TANDEM: DEBUG
    restart: always
    networks:
      - tandem-network

volumes:
  pgdata:

networks:
  tandem-network:
    external: true