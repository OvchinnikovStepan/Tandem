name: Auth Service CI

on:
  push:
    paths:
      - 'backend/auth_service/**'
      - '.github/workflows/auth-service-ci.yml'

  pull_request:
    paths:
      - 'backend/auth_service/**'
      - '.github/workflows/auth-service-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: auth_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend/auth_service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -U auth_user -d auth_db && echo "Postgres is up" && exit 0
            echo "Waiting for postgres..."
            sleep 3
          done
          exit 1

      - name: Run Flyway migrations
        run: mvn flyway:migrate
        env:
          FLYWAY_URL: jdbc:postgresql://localhost:5432/auth_db
          FLYWAY_USER: auth_user
          FLYWAY_PASSWORD: auth_pass

      - name: Generate jOOQ sources
        run: mvn jooq-codegen:generate -P jooq
        env:
          DB_URL: jdbc:postgresql://localhost:5432/auth_db
          DB_USER: auth_user
          DB_PASSWORD: auth_pass

      - name: Run tests and coverage
        run: mvn test jacoco:report -P jooq
        env:
          DB_URL: jdbc:postgresql://localhost:5432/auth_db
          DB_USER: auth_user
          DB_PASSWORD: auth_pass

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-jacoco-report
          path: backend/auth_service/target/site/jacoco

      - name: Publish test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: "backend/auth_service/target/surefire-reports/*.xml"
