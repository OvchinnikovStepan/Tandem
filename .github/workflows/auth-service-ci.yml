name: Auth Service CI

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - "backend/auth_service/**"
  pull_request:
    paths:
      - "backend/auth_service/**"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/auth_service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Run tests and coverage
        run: mvn clean test jacoco:report -P '!jooq'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-jacoco-report
          path: backend/auth_service/target/site/jacoco

      - name: Publish test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: "backend/auth_service/target/surefire-reports/*.xml"
